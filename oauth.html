<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script><title>Money Moves</title></head><body><p id="s">Finishing secure bank connection…</p><script>(async()=>{const t=localStorage.getItem('money_moves_link_token');if(!t)return document.getElementById('s').textContent='Return to Money Moves and reconnect your bank.';Plaid.create({token:t,receivedRedirectUri:location.href,onSuccess:async p=>{const r=await fetch('/api/bank/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({publicToken:p})});if(r.ok){localStorage.removeItem('money_moves_link_token');location.replace('/?bank=connected')}else document.getElementById('s').textContent='Could not finish bank connection.'},onExit:()=>location.replace('/')}).open()})()</script></body></html>
